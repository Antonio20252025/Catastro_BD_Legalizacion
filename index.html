<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa Catastro por Años</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet.fullscreen@3.0.0/Control.FullScreen.css">

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial, sans-serif;
    background:#d2e2f7;
}

/* =========================
   ENCABEZADO
========================= */

#encabezado{
    width:100%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    min-height:90px;
    box-shadow:0 2px 5px rgba(0,0,0,0.25);
    z-index:2000;
}

#encabezado .logo-manta{
    position:absolute;
    left:15px;
    top:8px;
    width:100px;
    max-height:75px;
    object-fit:contain;
}

#titulo{
    text-align:center;
    line-height:1.25;
    padding:10px 120px;
}

#titulo .municipio{
    font-size:20px;
    font-weight:bold;
}

#titulo .unidad{
    font-size:16px;
    font-weight:bold;
    margin-top:5px;
}

/* =========================
   MAPA
========================= */

#mapa{
    width:100%;
    height:75vh;
    position:relative;
}

.leaflet-container{
    font-family:Arial,sans-serif;
}

/* =========================
   BUSCADOR
========================= */

#buscadorPredio{
    position:absolute;
    bottom:15px;
    right:15px;
    z-index:1000;
    background:white;
    padding:8px;
    border-radius:8px;
    box-shadow:0 0 6px rgba(0,0,0,0.35);
    display:flex;
    gap:5px;
    align-items:center;
}

#inputBusqueda{
    width:220px;
    padding:8px;
    border:1px solid #aaa;
    border-radius:5px;
    font-size:14px;
}

#btnBuscar,
#btnVoz{
    border:none;
    border-radius:5px;
    padding:8px 10px;
    cursor:pointer;
    font-weight:bold;
}

#btnBuscar{
    background:#1976d2;
    color:white;
}

#btnVoz{
    background:#555;
    color:white;
}

/* =========================
   CONTROL HISTÓRICO
========================= */

#controlTiempo{
    position:absolute;
    bottom:15px;
    left:15px;
    z-index:1000;
    background:white;
    padding:10px 15px;
    border:2px solid #1976d2;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.35);
    text-align:center;
    min-width:230px;
}

.tituloTiempo{
    font-size:14px;
    font-weight:bold;
    color:#1976d2;
}

#valorAnio{
    font-size:25px;
    font-weight:bold;
    margin:4px 0;
    color:#222;
}

#sliderAnios{
    width:100%;
    cursor:pointer;
}

/* =========================
   PREDIOS POR CENSAR
========================= */

#cuadroPrediosCensar{
    position:absolute;
    bottom:15px;
    left:285px;
    z-index:1000;
    background:white;
    padding:10px 15px;
    border:2px solid red;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.35);
    text-align:center;
    font-weight:bold;
    min-width:180px;
}

.tituloCensar{
    color:red;
    font-size:14px;
}

.numeroCensar{
    color:#d35400;
    font-size:25px;
    margin-top:3px;
    margin-bottom:5px;
}

#btnPrediosCensar{
    border:none;
    background:red;
    color:white;
    padding:7px 18px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

#btnPrediosCensar:hover{
    background:#b00000;
}

/* =========================
   LEYENDA
========================= */

#leyenda{
    position:absolute;
    bottom:15px;
    right:15px;
    z-index:1000;
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.35);
    font-size:12px;
}

.leyendaTitulo{
    font-weight:bold;
    margin-bottom:5px;
}

.leyendaItem{
    display:flex;
    align-items:center;
    margin:3px 0;
}

.leyendaColor{
    width:25px;
    height:12px;
    margin-right:6px;
    border:2px solid;
}

/* =========================
   BOTÓN ADMIN
========================= */

#btnAdmin{
    position:absolute;
    top:10px;
    right:10px;
    z-index:1000;
    background:#333;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

/* =========================
   POPUP
========================= */

.popupCampos{
    max-height:400px;
    overflow-y:auto;
}

.popupTabla{
    border-collapse:collapse;
    width:100%;
    font-size:13px;
}

.popupTabla td{
    border-bottom:1px solid #ddd;
    padding:4px;
    vertical-align:top;
}

.popupTabla td:first-child{
    font-weight:bold;
    background:#f2f2f2;
    width:40%;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){

    #encabezado{
        min-height:75px;
    }

    #encabezado .logo-manta{
        width:90px;
        max-height:60px;
        left:5px;
    }

    #titulo{
        padding:8px 90px;
    }

    #titulo .municipio{
        font-size:14px;
    }

    #titulo .unidad{
        font-size:11px;
    }

    #mapa{
        height:65vh;
    }

    #controlTiempo{
        left:10px;
        bottom:10px;
        min-width:170px;
        padding:7px;
    }

    #cuadroPrediosCensar{
        left:200px;
        bottom:10px;
        min-width:140px;
        padding:7px;
    }

    .tituloCensar,
    .tituloTiempo{
        font-size:11px;
    }

    #valorAnio,
    .numeroCensar{
        font-size:20px;
    }

    #buscadorPredio{
        bottom:80px;
        right:5px;
        left:5px;
        justify-content:center;
    }

    #inputBusqueda{
        width:150px;
    }

    #leyenda{
        display:none;
    }

}

/* =========================
   CONTROL DE PARPADEO
========================= */

.parpadeo{
    transition:opacity 0.15s ease;
}

</style>

</head>

<body>

<!-- =========================
     ENCABEZADO
========================= -->

<div id="encabezado">

    <img src="imagenmanta.png"
         class="logo-manta"
         alt="Manta">

    <div id="titulo">

        <div class="municipio">
            GOBIERNO AUTÓNOMO DESCENTRALIZADO DEL CANTÓN MANTA
        </div>

        <div class="unidad">
            UNIDAD DE GESTIÓN Y TITULARIZACIÓN DE TIERRAS
        </div>

    </div>

</div>


<!-- =========================
     MAPA
========================= -->

<div id="mapa">

    <button id="btnAdmin">
        GENERAR LINK
    </button>


    <!-- CONTROL HISTÓRICO -->

    <div id="controlTiempo">

        <div class="tituloTiempo">
            HISTÓRICO DE AÑOS
        </div>

        <div id="valorAnio">
            Mover barra para iniciar
        </div>

        <input
            type="range"
            id="sliderAnios"
            min="0"
            max="9"
            step="1"
            value="0"
        >

    </div>


    <!-- PREDIOS POR CENSAR -->

    <div id="cuadroPrediosCensar">

        <div class="tituloCensar">
            PREDIOS POR CENSAR
        </div>

        <div
            id="cantidadPrediosCensar"
            class="numeroCensar">
            Cargando...
        </div>

        <button
            id="btnPrediosCensar"
            onclick="mostrarPrediosCensar()">
            MOSTRAR
        </button>

    </div>


    <!-- BUSCADOR -->

    <div id="buscadorPredio">

        <input
            type="text"
            id="inputBusqueda"
            placeholder="Clave, propietario o cédula">

        <button id="btnBuscar">
            BUSCAR
        </button>

        <button id="btnVoz">
            🎤
        </button>

    </div>


    <!-- LEYENDA -->

    <div id="leyenda">

        <div class="leyendaTitulo">
            AÑOS
        </div>

        <div class="leyendaItem">
            <span class="leyendaColor"
                  style="border-color:blue;">
            </span>
            2019
        </div>

        <div class="leyendaItem">
            <span class="leyendaColor"
                  style="border-color:purple;">
            </span>
            2020
        </div>

        <div class="leyendaItem">
            <span class="leyendaColor"
                  style="border-color:orange;">
            </span>
            2021
        </div>

        <div class="leyendaItem">
            <span class="leyendaColor"
                  style="border-color:red;">
            </span>
            2022
        </div>

        <div class="leyendaItem">
            <span class="leyendaColor"
                  style="border-color:cyan;">
            </span>
            2023
        </div>

        <div class="leyendaItem">
            <span class="leyendaColor"
                  style="border-color:magenta;">
            </span>
            2024
        </div>

        <div class="leyendaItem">
            <span class="leyendaColor"
                  style="border-color:yellow;">
            </span>
            2025
        </div>

        <div class="leyendaItem">
            <span class="leyendaColor"
                  style="border-color:#00aa00;">
            </span>
            2026
        </div>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.fullscreen@3.0.0/Control.FullScreen.js"></script>


<script>

/* =====================================================
   MAPA
===================================================== */

var map = L.map("mapa", {
    fullscreenControl:true
}).setView(
    [-0.999491,-80.761089],
    14
);


/* =====================================================
   MAPAS BASE
===================================================== */

var osm = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:25,
        attribution:"© OpenStreetMap"
    }
);

var google = L.tileLayer(
    "https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",
    {
        maxZoom:25
    }
);

var googleHybrid = L.tileLayer(
    "https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}",
    {
        maxZoom:25,
        opacity:0.6
    }
);

googleHybrid.addTo(map);


L.control.layers(
    {
        "OpenStreetMap":osm,
        "Google":google,
        "Google Híbrido":googleHybrid
    }
).addTo(map);


/* =====================================================
   VARIABLES DE CAPAS
===================================================== */

var capa2019 = null;
var capa2020 = null;
var capa2021 = null;
var capa2022 = null;
var capa2023 = null;
var capa2024 = null;
var capa2025 = null;
var capa2026 = null;


/* =====================================================
   PREDIOS POR CENSAR
===================================================== */

var capaPrediosCensar = null;

var prediosCensarMostrados = false;

var estadoParpadeoCensar = true;


/* =====================================================
   LISTA DE CAPAS DE AÑOS
===================================================== */

var capasAnios = [
    {
        anio:2019,
        variable:"capa2019",
        color:"yellow",
        borde:"blue"
    },
    {
        anio:2020,
        variable:"capa2020",
        color:"violet",
        borde:"purple"
    },
    {
        anio:2021,
        variable:"capa2021",
        color:"blue",
        borde:"orange"
    },
    {
        anio:2022,
        variable:"capa2022",
        color:"pink",
        borde:"red"
    },
    {
        anio:2023,
        variable:"capa2023",
        color:"darkblue",
        borde:"cyan"
    },
    {
        anio:2024,
        variable:"capa2024",
        color:"sandybrown",
        borde:"magenta"
    },
    {
        anio:2025,
        variable:"capa2025",
        color:"white",
        borde:"yellow"
    },
    {
        anio:2026,
        variable:"capa2026",
        color:"lightgreen",
        borde:"#00aa00"
    }
];


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(valor){

    if(valor === null ||
       valor === undefined){

        return "";
    }

    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   POPUP DE TODOS LOS CAMPOS
===================================================== */

function crearPopupTodosLosCampos(properties){

    var html =
        '<div class="popupCampos">' +
        '<table class="popupTabla">';

    Object.keys(properties).forEach(function(campo){

        var valor = properties[campo];

        if(valor === null ||
           valor === undefined ||
           valor === ""){

            valor = "";
        }

        html +=
            "<tr>" +
            "<td>" +
            escaparHTML(campo) +
            "</td>" +
            "<td>" +
            escaparHTML(valor) +
            "</td>" +
            "</tr>";

    });

    html +=
        "</table>" +
        "</div>";

    return html;
}


/* =====================================================
   POPUP NORMAL DE PREDIOS
===================================================== */

function crearPopupPredio(properties){

    var campos = [
        "clavecatas",
        "zona",
        "sector",
        "manzana",
        "lote",
        "propietari",
        "documentop",
        "direccion",
        "area_m2",
        "zonaurbano",
        "parroquia",
        "barrio",
        "RESOLUCION",
        "N_Ficha",
        "observacio"
    ];

    var html =
        '<div class="popupCampos">' +
        '<table class="popupTabla">';

    campos.forEach(function(campo){

        if(
            Object.prototype.hasOwnProperty.call(
                properties,
                campo
            )
        ){

            var valor = properties[campo];

            if(valor === null ||
               valor === undefined){

                valor = "";
            }

            html +=
                "<tr>" +
                "<td>" +
                escaparHTML(campo) +
                "</td>" +
                "<td>" +
                escaparHTML(valor) +
                "</td>" +
                "</tr>";
        }

    });


    /*
       Mostrar también cualquier campo adicional
       que exista en el GeoJSON.
    */

    Object.keys(properties).forEach(function(campo){

        if(campos.indexOf(campo) === -1){

            var valor = properties[campo];

            if(valor === null ||
               valor === undefined){

                valor = "";
            }

            html +=
                "<tr>" +
                "<td>" +
                escaparHTML(campo) +
                "</td>" +
                "<td>" +
                escaparHTML(valor) +
                "</td>" +
                "</tr>";
        }

    });

    html +=
        "</table>" +
        "</div>";

    return html;
}


/* =====================================================
   CREAR CAPA DE AÑO
===================================================== */

function crearCapa(datos, relleno, contorno){

    return L.geoJSON(datos, {

        style:function(){

            return {
                color:contorno,
                weight:2,
                fillColor:relleno,
                fillOpacity:0.6,
                opacity:1
            };

        },

        onEachFeature:function(feature,layer){

            var p = feature.properties || {};

            layer.bindPopup(
                crearPopupPredio(p)
            );

            layer.on({

                mouseover:function(e){

                    e.target.setStyle({

                        weight:4,
                        color:"red",
                        fillOpacity:0.75

                    });

                    e.target.openPopup();

                },

                mouseout:function(e){

                    e.target.setStyle({

                        weight:2,
                        color:contorno,
                        fillColor:relleno,
                        fillOpacity:0.6,
                        opacity:1

                    });

                }

            });

        }

    });

}


/* =====================================================
   CARGAR CAPA
===================================================== */

function cargar(
    url,
    color,
    borde,
    variable
){

    fetch(url)

    .then(function(r){

        if(!r.ok){

            throw new Error(
                "Error cargando " + url
            );

        }

        return r.json();

    })

    .then(function(data){

        window[variable] =
            crearCapa(
                data,
                color,
                borde
            );

    })

    .catch(function(error){

        console.error(
            "Error cargando capa:",
            error
        );

    });

}


/* =====================================================
   CARGAR AÑOS
===================================================== */

cargar(
    "https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2019.geojson",
    "yellow",
    "blue",
    "capa2019"
);

cargar(
    "https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2020.geojson",
    "violet",
    "purple",
    "capa2020"
);

cargar(
    "https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2021.geojson",
    "blue",
    "orange",
    "capa2021"
);

cargar(
    "https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2022.geojson",
    "pink",
    "red",
    "capa2022"
);

cargar(
    "https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2023.geojson",
    "darkblue",
    "cyan",
    "capa2023"
);

cargar(
    "https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2024.geojson",
    "sandybrown",
    "magenta",
    "capa2024"
);

cargar(
    "https://raw.githubusercontent.com/Antonio20252025/Catastro_Legalizacion/main/2025.geojson",
    "white",
    "yellow",
    "capa2025"
);

cargar(
    "https://raw.githubusercontent.com/Antonio20252025/Catastro_BD_Legalizacion/main/2026.geojson",
    "lightgreen",
    "#00aa00",
    "capa2026"
);


/* =====================================================
   CARGAR PREDIOS POR CENSAR
===================================================== */

fetch("487_Predios.geojson")

.then(function(response){

    if(!response.ok){

        throw new Error(
            "No se pudo cargar 487_Predios.geojson"
        );

    }

    return response.json();

})

.then(function(data){

    capaPrediosCensar = L.geoJSON(
        data,
        {

            style:function(){

                return {

                    color:"red",
                    weight:2,
                    fillColor:"red",
                    fillOpacity:0.55,
                    opacity:1

                };

            },

            onEachFeature:function(
                feature,
                layer
            ){

                var properties =
                    feature.properties || {};

                /*
                   AQUÍ SE MUESTRAN TODOS LOS
                   CAMPOS EXISTENTES DEL PREDIO.
                */

                layer.bindPopup(
                    crearPopupTodosLosCampos(
                        properties
                    )
                );

                layer.on({

                    mouseover:function(e){

                        e.target.setStyle({

                            weight:4,
                            color:"yellow",
                            fillOpacity:0.8

                        });

                        e.target.openPopup();

                    },

                    mouseout:function(e){

                        e.target.setStyle({

                            weight:2,
                            color:"red",
                            fillColor:"red",
                            fillOpacity:0.55,
                            opacity:1

                        });

                    }

                });

            }

        }
    );


    /*
       MOSTRAR CANTIDAD
    */

    document.getElementById(
        "cantidadPrediosCensar"
    ).innerHTML =
        data.features
        ? data.features.length
        : 0;


    /*
       IMPORTANTE:
       NO se agrega al mapa aquí.
       Permanece oculto hasta pulsar MOSTRAR.
    */

})

.catch(function(error){

    console.error(
        "Error cargando predios por censar:",
        error
    );

    document.getElementById(
        "cantidadPrediosCensar"
    ).innerHTML = "Error";

});


/* =====================================================
   QUITAR SOLO CAPAS DE AÑOS
===================================================== */

function quitarCapasAnios(){

    var capas = [
        capa2019,
        capa2020,
        capa2021,
        capa2022,
        capa2023,
        capa2024,
        capa2025,
        capa2026
    ];

    capas.forEach(function(capa){

        if(
            capa &&
            map.hasLayer(capa)
        ){

            map.removeLayer(capa);

        }

    });

}


/* =====================================================
   OCULTAR PREDIOS POR CENSAR
===================================================== */

function ocultarPrediosCensar(){

    if(
        capaPrediosCensar &&
        map.hasLayer(capaPrediosCensar)
    ){

        map.removeLayer(
            capaPrediosCensar
        );

    }

    prediosCensarMostrados = false;

    document.getElementById(
        "btnPrediosCensar"
    ).innerHTML = "MOSTRAR";

}


/* =====================================================
   MOSTRAR / OCULTAR PREDIOS POR CENSAR
===================================================== */

function mostrarPrediosCensar(){

    var boton =
        document.getElementById(
            "btnPrediosCensar"
        );


    /*
       SI YA ESTÁN MOSTRADOS:
       OCULTAR
    */

    if(prediosCensarMostrados){

        ocultarPrediosCensar();

        return;

    }


    /*
       PRIMERO QUITAMOS TODOS LOS AÑOS
    */

    quitarCapasAnios();


    /*
       LUEGO MOSTRAMOS LOS PREDIOS
    */

    if(capaPrediosCensar){

        map.addLayer(
            capaPrediosCensar
        );

        prediosCensarMostrados = true;

        boton.innerHTML = "OCULTAR";

        /*
           Dejamos el histórico en estado inicial
           para que no quede seleccionado un año.
        */

        document.getElementById(
            "sliderAnios"
        ).value = 0;

        document.getElementById(
            "valorAnio"
        ).innerHTML =
            "Predios por censar";

    }

}


/* =====================================================
   MOSTRAR UN AÑO
===================================================== */

function mostrarCapa(anio){

    /*
       OCULTAR PREDIOS POR CENSAR
    */

    ocultarPrediosCensar();


    /*
       QUITAR AÑOS ANTERIORES
    */

    quitarCapasAnios();


    var capa = null;


    if(anio === 2019){

        capa = capa2019;

    }

    else if(anio === 2020){

        capa = capa2020;

    }

    else if(anio === 2021){

        capa = capa2021;

    }

    else if(anio === 2022){

        capa = capa2022;

    }

    else if(anio === 2023){

        capa = capa2023;

    }

    else if(anio === 2024){

        capa = capa2024;

    }

    else if(anio === 2025){

        capa = capa2025;

    }

    else if(anio === 2026){

        capa = capa2026;

    }


    if(capa){

        map.addLayer(capa);

    }

/* =====================================================
   BUSCAR PREDIO
===================================================== */

function buscarPredio(){

    var texto =
        document.getElementById(
            "inputBusqueda"
        ).value
        .trim()
        .toLowerCase();


    if(!texto){

        alert(
            "Ingrese una clave, propietario o cédula."
        );

        return;

    }


    var encontrado = false;


    var capas = [

        capa2019,
        capa2020,
        capa2021,
        capa2022,
        capa2023,
        capa2024,
        capa2025,
        capa2026

    ];


    capas.forEach(function(capa){

        if(!capa){

            return;

        }


        capa.eachLayer(
            function(layer){

                if(encontrado){

                    return;

                }


                var p =
                    layer.feature &&
                    layer.feature.properties
                    ? layer.feature.properties
                    : {};


                var clave =
                    String(
                        p.clavecatas || ""
                    ).toLowerCase();

                var propietario =
                    String(
                        p.propietari || ""
                    ).toLowerCase();

                var cedula =
                    String(
                        p.documentop || ""
                    ).toLowerCase();


                if(
                    clave.includes(texto) ||
                    propietario.includes(texto) ||
                    cedula.includes(texto)
                ){

                    encontrado = true;

                    map.fitBounds(
                        layer.getBounds(),
                        {
                            maxZoom:19
                        }
                    );

                    layer.openPopup();

                }

            }
        );

    });


    /*
       También buscar en predios por censar
    */

    if(
        !encontrado &&
        capaPrediosCensar
    ){

        capaPrediosCensar.eachLayer(
            function(layer){

                if(encontrado){

                    return;

                }


                var p =
                    layer.feature &&
                    layer.feature.properties
                    ? layer.feature.properties
                    : {};


                var clave =
                    String(
                        p.clavecatas ||
                        p.CLAVECATAS ||
                        p.ID ||
                        ""
                    ).toLowerCase();

                var propietario =
                    String(
                        p.propietari ||
                        p.POSESIONAR ||
                        ""
                    ).toLowerCase();

                var cedula =
                    String(
                        p.documentop ||
                        p.CEDULA__R ||
                        ""
                    ).toLowerCase();


                if(
                    clave.includes(texto) ||
                    propietario.includes(texto) ||
                    cedula.includes(texto)
                ){

                    encontrado = true;


                    /*
                       Si encontramos un predio por censar,
                       lo mostramos automáticamente.
                    */

                    quitarCapasAnios();


                    if(
                        !prediosCensarMostrados
                    ){

                        map.addLayer(
                            capaPrediosCensar
                        );

                        prediosCensarMostrados =
                            true;

                        document.getElementById(
                            "btnPrediosCensar"
                        ).innerHTML =
                            "OCULTAR";

                    }


                    map.fitBounds(
                        layer.getBounds(),
                        {
                            maxZoom:19
                        }
                    );


                    layer.openPopup();

                }

            }
        );

    }


    if(!encontrado){

        alert(
            "No se encontró el predio."
        );

    }

}

/* =====================================================
   BÚSQUEDA POR VOZ
===================================================== */

document.getElementById(
    "btnVoz"
).addEventListener(
    "click",
    function(){

        var SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if(!SpeechRecognition){

            alert(
                "Su navegador no permite búsqueda por voz."
            );

            return;

        }


        var recognition =
            new SpeechRecognition();


        recognition.lang = "es-EC";

        recognition.continuous = false;

        recognition.interimResults = false;


        recognition.onresult =
            function(event){

                var texto =
                    event.results[0][0]
                    .transcript
                    .toLowerCase();


                /*
                   Correcciones habituales
                   para números y símbolos.
                */

                texto =
                    texto
                    .replace(
                        /raya/g,
                        "-"
                    )
                    .replace(
                        /guion/g,
                        "-"
                    )
                    .replace(
                        /guión/g,
                        "-"
                    )
                    .replace(
                        /slash/g,
                        "/"
                    );


                document.getElementById(
                    "inputBusqueda"
                ).value = texto;


                buscarPredio();

            };


        recognition.onerror =
            function(){

                alert(
                    "No se pudo realizar la búsqueda por voz."
                );

            };


        recognition.start();

    }
);


/* =====================================================
   BOTÓN GENERAR LINK ADMINISTRATIVO
===================================================== */

document.getElementById(
    "btnAdmin"
).addEventListener(
    "click",
    function(){

        var minutos =
            prompt(
                "¿Cuántos MINUTOS quieres que dure el link? (60 = 1 hora)"
            );


        if(!minutos){

            return;

        }


        minutos =
            parseInt(minutos);


        if(
            isNaN(minutos) ||
            minutos <= 0
        ){

            minutos = 60;

        }


        var ahora =
            new Date();


        ahora.setMinutes(
            ahora.getMinutes() +
            minutos
        );


        var fechaExp =
            ahora.toISOString();


        var urlBase =
            window.location.origin +
            window.location.pathname;


        var linkFinal =
            urlBase +
            "?exp=" +
            encodeURIComponent(
                fechaExp
            ) +
            "&token=ABC123";


        if(
            navigator.clipboard &&
            navigator.clipboard.writeText
        ){

            navigator.clipboard.writeText(
                linkFinal
            );

        }


        alert(
            "Link válido por " +
            minutos +
            " minutos\n\n" +
            linkFinal
        );

    }
);

)

.then(function(response){

            "Error cargando parroquias"
        );

    }

    return response.json();

})

.then(function(data){

    var capaParroquias =
        L.geoJSON(
            data,
            {

                style:function(){

                    return {

                        color:"blue",
                        weight:2,
                        fillOpacity:0,
                        opacity:1

                    };

                },

                onEachFeature:
                function(
                    feature,
                    layer
                ){

                    var p =
                        feature.properties ||
                        {};


                    /*
                       Intentar encontrar nombre
                       de parroquia.
                    */

                    var nombre =
                        p.PARROQUIA ||
                        p.parroquia ||
                        p.NOMBRE ||
                        p.nombre ||

                        layer.bindTooltip(
                            String(nombre),
                            {
                                permanent:true,
                                direction:"center",
                                className:"etiquetaParroquia"
                            }
                        );

                    }

                }

            }
        )
        .addTo(map);

})

.catch(function(error){

    console.error(
        "Error cargando parroquias:",
        error
    );

});
