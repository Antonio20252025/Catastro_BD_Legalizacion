/* =====================================================
   CREAR CAPA CATASTRO
===================================================== */

function crearCapa(datos,relleno,contorno){

return L.geoJson(datos,{

style:function(){

return{

color:contorno,

weight:2,

fillColor:relleno,

fillOpacity:0.5

};

},


onEachFeature:function(feature,capa){

console.log(feature.properties);

var p=feature.properties || {};


capa.bindPopup(

"<strong>Clave Catastral: </strong>"+
(p.clavecatas || "")+

"<br>"+

"<strong>Zona: </strong>"+
(p.zona || "")+

"<br>"+

"<strong>Sector: </strong>"+
(p.sector || "")+

"<br>"+

"<strong>Manzana: </strong>"+
(p.manzana || "")+

"<br>"+

"<strong>Lote: </strong>"+
(p.lote || "")+

"<br>"+

"<strong>Propietario: </strong>"+
(p.propietari || "")+

"<br>"+

"<strong>Cedula: </strong>"+
(p.documentop || "")+

"<br>"+

"<strong>Dirección: </strong>"+
(p.direccion || "")+

"<br>"+

"<strong>Área: </strong>"+
(p.area_m2 || "")+

"<br>"+

"<strong>Zona: </strong>"+
(p.zonaurbano || "")+

"<br>"+

"<strong>Parroquia: </strong>"+
(p.parroquia || "")+

"<br>"+

"<strong>Barrio: </strong>"+
(p.barrio || "")+

"<br>"+

"<strong>Resolución: </strong>"+
(p.RESOLUCION || "")+

"<br>"+

"<strong>Observación: </strong>"+
(p.observacio || "")

);


/* MOUSEOVER */

capa.on("mouseover",function(){

this.setStyle({

color:'red',

weight:4,

fillOpacity:0.9

});

this.openPopup();

});


/* MOUSEOUT */

capa.on("mouseout",function(){

this.setStyle({

color:contorno,

weight:2,

fillColor:relleno,

fillOpacity:0.5

});

this.closePopup();

});

}

});

}

/* =====================================================
   CARGAR CAPAS
===================================================== */

function cargar(url,color,borde,variable){

fetch(url)

.then(function(r){

if(!r.ok){

throw new Error(
"Error cargando "+url
);

}

return r.json();

})

.then(function(data){

window[variable]=crearCapa(
data,
color,
borde
);

})

.catch(function(error){

console.error(
"Error cargando capa:",
error
);

});

}

function obtenerCapas(){

capa2025,
capa2026

/* =====================================================
   QUITAR TODAS LAS CAPAS
===================================================== */

function quitarTodasLasCapas(){

obtenerCapas().forEach(function(capa){

if(capa && map.hasLayer(capa)){

map.removeLayer(capa);

}

});

}

   MOSTRAR CAPA
===================================================== */

if(anio==2019 && capa2019)
map.addLayer(capa2019);

map.addLayer(capa2020);

map.addLayer(capa2022);

map.addLayer(capa2023);


if(anio==2024 && capa2024)
map.addLayer(capa2024);


if(anio==2025 && capa2025)
map.addLayer(capa2025);


if(anio==2026 && capa2026)
map.addLayer(capa2026);

}

/* =====================================================
   PARPADEO
===================================================== */

function activarParpadeo(){

var estado=true;


setInterval(function(){

obtenerCapas().forEach(function(capa){

if(capa){

capa.eachLayer(function(layer){

if(estado){

layer.setStyle({

fillOpacity:0.1,

opacity:0.3

});

}else{

layer.setStyle({

fillOpacity:0.6,

opacity:1

});

}

});

}

});


estado=!estado;

},300);

}


activarParpadeo();


/* =====================================================
   BUSCAR PREDIO
===================================================== */

function buscarPredio(){

var texto=

document.getElementById(
"textoBuscar"
).value

.toLowerCase()

.trim();


if(texto===""){

return;

}


var capas=obtenerCapas();


/* RESTAURAR ESTILOS */

capas.forEach(function(capa){

if(capa){

capa.eachLayer(function(layer){

capa.resetStyle(layer);

});

}

});


/* BUSCAR */

capas.forEach(function(capa){

if(capa){

capa.eachLayer(function(layer){

var p=layer.feature.properties || {};


var clave=

(p.clavecatas || "")
.toString()
.toLowerCase();


var propietario=

(p.propietari || "")
.toString()
.toLowerCase();


var cedula=

(p.documentop || "")
.toString()
.toLowerCase();


if(

clave.includes(texto) ||

propietario.includes(texto) ||

cedula.includes(texto)

){

if(!map.hasLayer(capa)){

map.addLayer(capa);

}


map.fitBounds(
layer.getBounds()
);


layer.setStyle({

color:'red',

weight:4,

fillColor:'red',

fillOpacity:0.9

});


layer.openPopup();

}

});

}

});

}


/* =====================================================
   BUSQUEDA POR VOZ
===================================================== */

function iniciarVoz(){

var SpeechRecognition=

window.SpeechRecognition ||

window.webkitSpeechRecognition;


if(!SpeechRecognition){

alert(
"Tu navegador no soporta reconocimiento de voz"
);

return;

}


var reconocimiento=
new SpeechRecognition();


reconocimiento.lang="es-EC";

reconocimiento.interimResults=false;

reconocimiento.maxAlternatives=1;


reconocimiento.start();


reconocimiento.onresult=function(event){

var texto=
event.results[0][0].transcript;


console.log(
"Texto detectado:",
texto
);


texto=texto

.replace(/raya/g,"-")

.replace(/guion/g,"-")

.replace(/guión/g,"-")

.replace(/slash/g,"/")

.replace(/barra/g,"/")

.replace(/punto/g,".")

.replace(/coma/g,",")

.replace(/espacio/g," ")

.replace(/guion bajo/g,"_");


document.getElementById(
"textoBuscar"
).value=texto;


buscarPredio();

};


reconocimiento.onerror=function(event){

console.log(
"Error voz:",
event.error
);

alert(
"Error en reconocimiento de voz"
);

};

}


/* =====================================================
   CAPAS ADMINISTRATIVAS
===================================================== */

var grupoLimites=
L.layerGroup().addTo(map);


function capaLimite(datos,color){

return L.geoJson(datos,{

style:{

color:color,

weight:4,

opacity:1,

fillOpacity:0

},


onEachFeature:function(feature,layer){

if(feature.properties){

var nombre=

feature.properties.nombre ||

feature.properties.NOMBRE ||

feature.properties.parroquia ||

feature.properties.barrio ||

"";


if(nombre!=""){

layer.bindTooltip(
nombre,
{
permanent:false,
direction:"center",
className:"labelLimite"
}
);

}

}

}

});

}


/* =====================================================
   COLORES PARROQUIAS
===================================================== */

function getColorParroquia(i){

var colores=[

"#fde0dd",
"#e0ecf4",
"#e6f5d0",
"#fff2ae",
"#f1e2cc",
"#d9f0f3",
"#fddbc7",
"#e7d4e8",
"#ccebc5",
"#fbb4ae",
"#b3cde3",
"#decbe4",
"#fed9a6",
"#ffffcc",
"#e5d8bd"

];

return colores[
i % colores.length
];

}


/* =====================================================
   PARROQUIAS
===================================================== */

fetch(

"https://raw.githubusercontent.com/Antonio20252025/Catastro_BD_Legalizacion/refs/heads/main/Parroquias_Urbanas_y_Rurales.geojson"

)

.then(function(r){

return r.json();

})

.then(function(data){

var coloresParroquia={};

var i=0;


var parroquias=L.geoJson(

data,

{

style:function(feature){

var nombre=(

feature.properties.parroquia ||

feature.properties.nombre ||

feature.properties.name ||

feature.properties.NOMBRE ||

"sin_nombre"

)

.toString()

.trim()

.toUpperCase();


if(!coloresParroquia[nombre]){

coloresParroquia[nombre]=
getColorParroquia(i++);

}


return{

color:"#333",

weight:1.5,

dashArray:"10,15",

fillColor:
coloresParroquia[nombre],

fillOpacity:0.30,

opacity:0.9

};

},


onEachFeature:function(feature,layer){

var nombre=

feature.properties.name ||

feature.properties.nombre ||

feature.properties.NOMBRE ||

feature.properties.parroquia ||

"";


if(nombre!=""){

layer.bindTooltip(

nombre,

{

permanent:true,

direction:"center",

className:"labelParroquia"

}

);

}

}

}

);


grupoLimites.addLayer(
parroquias
);

});

/* =====================================================
   GENERAR LINK
===================================================== */

document.getElementById(
"btnAdmin"
).addEventListener(
"click",
function(){

var minutos=prompt(

"¿Cuántos MINUTOS quieres que dure el link? (60 = 1 hora)"

);


if(!minutos)
return;


minutos=parseInt(minutos);


if(
isNaN(minutos) ||
minutos<=0
){

minutos=60;

}


var ahora=new Date();


ahora.setMinutes(
ahora.getMinutes()+minutos
);


var fechaExp=
ahora.toISOString();


var urlBase=
window.location.origin+
window.location.pathname;


var linkFinal=
urlBase+
"?exp="+
fechaExp+
"&token=ABC123";


navigator.clipboard.writeText(
linkFinal
);


alert(

"Link válido por "+
minutos+
" minutos\n\n"+
linkFinal

);

});
